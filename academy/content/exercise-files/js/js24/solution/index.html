<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ralfiz Store</title>
    <style>
      :root {
        --accent: #2563eb;
        --line: #e5e7eb;
        --muted: #6b7280;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: #111827;
        background: #f8fafc;
      }
      .shell {
        max-width: 880px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }
      .env {
        font-size: 12px;
        color: var(--muted);
      }
      .grid {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }
      .card h2 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .price {
        margin-top: 8px;
        font-weight: 700;
        color: var(--accent);
      }
      .status {
        color: var(--muted);
      }
      .status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <h1 id="title">Ralfiz Store</h1>
        <span class="env" id="env"></span>
      </header>
      <p class="status" id="status" role="status">Loading products...</p>
      <ul class="grid" id="grid"></ul>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
