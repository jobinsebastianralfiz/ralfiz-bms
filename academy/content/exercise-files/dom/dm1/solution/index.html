<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mentor profile · Ralfiz Academy</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <article class="card" id="profile">
      <div class="cover"></div>
      <div class="avatar" id="initials" aria-hidden="true">?</div>
      <h1 class="name" id="name">Loading…</h1>
      <p class="role" id="role"></p>
      <ul class="stats">
        <li><strong id="courses">–</strong><span>Courses</span></li>
        <li><strong id="followers">–</strong><span>Followers</span></li>
        <li><strong id="rating">–</strong><span>Rating</span></li>
      </ul>
      <div class="tags"></div>
      <div class="actions">
        <button class="btn primary" id="follow" aria-pressed="false">Follow</button>
        <button class="btn">Message</button>
      </div>
    </article>
  </main>
</body>
</html>
