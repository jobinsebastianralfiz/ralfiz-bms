{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block heading %}Staff login{% endblock %}
{% block content %}
<form method="post" class="max-w-sm space-y-4 bg-white p-6 rounded-xl shadow-sm">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <label class="block text-sm">Username {{ form.username }}</label>
  <label class="block text-sm">Password {{ form.password }}</label>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="w-full rounded-lg bg-indigo-600 py-2 text-white">Log in</button>
</form>
{% endblock %}
