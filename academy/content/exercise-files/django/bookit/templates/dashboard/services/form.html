{% extends "base.html" %}
{% block heading %}{% if object %}Edit {{ object.name }}{% else %}New service{% endif %}{% endblock %}
{% block content %}
<form method="post" class="bg-white rounded-xl shadow-sm p-6 max-w-xl space-y-4" novalidate>
  {% csrf_token %}
  {% for field in form %}
    <div>
      <label class="block text-sm font-medium mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<p class="text-xs text-red-600 mt-1">{{ error }}</p>{% endfor %}
    </div>
  {% endfor %}
  <button class="rounded-lg bg-indigo-600 px-4 py-2 text-white">Save</button>
</form>
{% endblock %}
