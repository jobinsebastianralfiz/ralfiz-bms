# Config for the Social Hub worker service (Settings -> Config-as-code path).
# Same image as the web service, but it runs the publisher loop instead of
# gunicorn, and has no health check: it serves no HTTP. Migrations run on the
# web service only.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python manage.py social_worker"
restartPolicyType = "ALWAYS"
