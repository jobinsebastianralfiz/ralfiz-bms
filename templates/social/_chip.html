{% load social_tags %}<a href="{% url 'social:calendar' %}?day={{ p.scheduled_at|date:'Y-m-d' }}#p{{ p.pk }}" class="sh-chip s-{{ p.status }}" {% if p.is_editable %}draggable="true"{% endif %} data-post="{{ p.pk }}" data-move="{% url 'social:post_move' p.pk %}" style="--pc:{{ platform_meta|get_item:p.platforms.0|get_item:'color'|default:'#64748b' }}" title="{{ p.workspace.name }} · {{ p.get_status_display }} · {{ p.base_text|truncatechars:120 }}">
  <span class="tm">{{ p.scheduled_at|time:'g:i'|cut:':00' }}{{ p.scheduled_at|time:'a'|slice:':1' }}</span><span class="tx">{% if p.status == 'failed' or p.status == 'partial' %}<i class="fas fa-triangle-exclamation"></i> {% endif %}{{ p.base_text|default:p.title|truncatechars:40 }}</span>
</a>
