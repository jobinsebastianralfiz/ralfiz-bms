{% extends 'client_portal/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div style="margin-bottom: 1rem;">
  <a href="{% url 'client_portal:portal_profile' %}" class="portal-link"><i class="fas fa-arrow-left"></i> Back to Profile</a>
</div>

<div style="max-width: 480px;">
  <div class="portal-page-header">
    <h1>Change Password</h1>
    <p>Update your account password</p>
  </div>

  <div class="portal-card">
    <div class="portal-card-body">
      {% if error %}
      <div class="alert alert-danger" style="margin-bottom: 1rem;">{{ error }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label">Current Password</label>
          <input type="password" name="old_password" class="form-control" required>
        </div>
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label">New Password</label>
          <input type="password" name="new_password" class="form-control" required minlength="8">
          <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">Minimum 8 characters</div>
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="8">
        </div>
        <button type="submit" class="portal-btn portal-btn-primary"><i class="fas fa-lock"></i> Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
