<style>
.sm-card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:1.5rem}
.sm-card__head{padding:1.25rem 1.5rem;border-bottom:1px solid #e5e7eb;background:#F9FAFB;border-radius:12px 12px 0 0}
.sm-card__head h3{font-size:1rem;font-weight:600;color:#1D2939;margin:0}
.sm-card__head h3 i{color:#465FFF;margin-right:.5rem}
.sm-card__head p{font-size:.75rem;color:#98A2B3;margin-top:.25rem}
.sm-card__body{padding:1.5rem}
.sm-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.sm-grid--3{grid-template-columns:1fr 1fr 1fr}
.sm-span{grid-column:1/-1}
.sm-label{display:block;font-size:.875rem;font-weight:500;color:#344054;margin-bottom:.375rem}
.sm-input{width:100%;height:44px;padding:0 1rem;border:1px solid #D0D5DD;border-radius:8px;font-size:.875rem;background:#fff}
textarea.sm-input{height:auto;padding:.75rem 1rem;resize:vertical}
.sm-help{font-size:.75rem;color:#98A2B3;margin-top:.25rem}
.sm-k{font-size:.75rem;color:#98A2B3}
.sm-v{font-size:.875rem;font-weight:500;color:#1D2939}
.sm-pill{display:inline-flex;align-items:center;gap:.375rem;padding:.25rem .625rem;border-radius:9999px;font-size:.75rem;font-weight:600}
.sm-pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sm-active{background:#ECFDF3;color:#027A48}
.sm-expiring,.sm-grace{background:#FFFAEB;color:#B54708}
.sm-expired{background:#FEF3F2;color:#B42318}
.sm-suspended{background:#FFFAEB;color:#B54708}
.sm-revoked{background:#F2F4F7;color:#344054}
.sm-btn{padding:.5rem .75rem;border:1px solid #D0D5DD;border-radius:8px;font-size:.8125rem;cursor:pointer;background:#fff;color:#344054;text-decoration:none;display:inline-block}
.sm-table{width:100%;border-collapse:collapse}
.sm-table th{text-align:left;padding:.75rem 1rem;font-size:.75rem;font-weight:500;color:#667085;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #E4E7EC}
.sm-table td{padding:.875rem 1rem;font-size:.875rem;color:#344054;border-bottom:1px solid #F2F4F7;vertical-align:top}
.sm-layout{display:grid;grid-template-columns:2fr 1fr;gap:1.5rem}
@media (max-width:900px){.sm-layout,.sm-grid,.sm-grid--3{grid-template-columns:1fr}}
</style>
