{% extends 'base.html' %}
{% block title %}Delete - Ralfiz BMS{% endblock %}
{% block content %}
<div class="card" style="max-width:560px"><div class="card-body">
  <h1 class="page-title" style="font-size:1.2rem">Delete {{ thing }}?</h1>
  <p class="text-muted">This can't be undone.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger" type="submit"><i class="fas fa-trash"></i> Delete</button>
    <a class="btn btn-outline-secondary" href="{{ back }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
