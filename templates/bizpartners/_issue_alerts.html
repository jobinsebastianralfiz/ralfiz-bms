{% comment %}Chime + note on every staff page when a business partner adds issues on any joint project.
Checks bizpartners:issue_alerts every 30 seconds. One open tab chimes; the others stay quiet.
Browsers only play sound after the person has clicked or typed on the page once.{% endcomment %}
<div id="jiAlerts" class="ji-alerts" aria-live="polite"></div>
<style>
.ji-alerts { position: fixed; right: 1rem; bottom: 1rem; z-index: 2000; display: grid; gap: .6rem; width: min(360px, calc(100vw - 2rem)); }
.ji-alert { background: #fff; border: 1px solid #e5e7eb; border-left: 4px solid #dc2626; border-radius: 12px; box-shadow: 0 10px 30px rgba(15,23,42,.18); padding: .8rem .9rem; font-size: .88rem; animation: jiAlertIn .25s ease-out; }
.ji-alert-top { display: flex; align-items: flex-start; gap: .5rem; }
.ji-alert-top i.fa-bell { color: #dc2626; margin-top: .15rem; }
.ji-alert strong { display: block; }
.ji-alert .ji-alert-sub { color: #6b7280; font-size: .8rem; margin-top: .1rem; }
.ji-alert .ji-alert-x { margin-left: auto; background: none; border: 0; color: #9ca3af; cursor: pointer; padding: 0 .2rem; }
.ji-alert-acts { display: flex; gap: .8rem; align-items: center; margin-top: .55rem; font-size: .82rem; }
.ji-alert-acts a { font-weight: 600; }
.ji-alert-acts button { background: none; border: 0; color: #6b7280; cursor: pointer; padding: 0; font: inherit; }
@keyframes jiAlertIn { from { transform: translateY(12px); opacity: 0; } }
</style>
<script>
(function () {
  if (window.jiAlertsOn) return;
  window.jiAlertsOn = true;
  var URL_ = "{% url 'bizpartners:issue_alerts' %}", KEY = 'jiAlertAfter', MUTE = 'jiAlertMute';
  var box = document.getElementById('jiAlerts'), ctx = null, unread = 0, baseTitle = document.title;

  // Sound needs one click or key press on the page first (browser rule).
  function unlock() {
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
  }
  ['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, unlock, { once: true, capture: true }); });

  function chime() {
    if (localStorage.getItem(MUTE) === '1') return;
    unlock();
    if (!ctx) return;
    var t = ctx.currentTime;
    [[880, 0], [1320, 0.16], [1760, 0.32]].forEach(function (n) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t + n[1]);
      g.gain.exponentialRampToValueAtTime(0.25, t + n[1] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + n[1] + 0.45);
      o.connect(g); g.connect(ctx.destination); o.start(t + n[1]); o.stop(t + n[1] + 0.5);
    });
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function show(item) {
    var card = el('div', 'ji-alert'), top = el('div', 'ji-alert-top'), txt = el('div');
    top.appendChild(el('i', 'fas fa-bell'));
    txt.appendChild(el('strong', '', item.partner + ' added ' + item.count + ' issue' + (item.count === 1 ? '' : 's')));
    txt.appendChild(el('div', 'ji-alert-sub', item.project));
    txt.appendChild(el('div', 'ji-alert-sub', '“' + item.title + '”' + (item.count > 1 ? ' and ' + (item.count - 1) + ' more' : '')));
    top.appendChild(txt);
    var x = el('button', 'ji-alert-x'); x.type = 'button'; x.setAttribute('aria-label', 'Close'); x.innerHTML = '<i class="fas fa-times"></i>';
    top.appendChild(x); card.appendChild(top);
    var acts = el('div', 'ji-alert-acts'), open = el('a', '', 'Open issue list'), mute = el('button', '', localStorage.getItem(MUTE) === '1' ? 'Sound on' : 'Mute sound');
    open.href = item.url; mute.type = 'button';
    acts.appendChild(open); acts.appendChild(mute); card.appendChild(acts);
    x.onclick = function () { card.remove(); seen(); };
    mute.onclick = function () {
      var off = localStorage.getItem(MUTE) !== '1';
      localStorage.setItem(MUTE, off ? '1' : '0'); mute.textContent = off ? 'Sound on' : 'Mute sound';
    };
    box.prepend(card);
    while (box.children.length > 4) box.lastChild.remove();
  }
  function seen() { if (!box.children.length) { unread = 0; document.title = baseTitle; } }

  function check() {
    var after = localStorage.getItem(KEY);
    fetch(URL_ + (after ? '?after=' + encodeURIComponent(after) : ''), { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.now) return;
        if (localStorage.getItem(KEY) !== after) return;  // another tab already took this round
        localStorage.setItem(KEY, d.now);
        if (!after || !d.items.length) return;
        d.items.forEach(show);
        unread += d.items.reduce(function (n, i) { return n + i.count; }, 0);
        document.title = '(' + unread + ') ' + baseTitle;
        chime();
      })
      .catch(function () {});
  }
  check();
  setInterval(check, 30000);
})();
</script>
