{% extends 'bizpartners/portal/base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1 style="font-size:1.35rem; margin:0 0 1rem">Change password</h1>
<section class="pv-card" style="padding:1.2rem; max-width:480px">
  <form method="post">{% csrf_token %}
    {% for field in form %}
    <div style="margin-bottom:.8rem"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
      {% for e in field.errors %}<div style="color:var(--danger); font-size:.8rem">{{ e }}</div>{% endfor %}</div>
    {% endfor %}
    <button class="pv-btn" type="submit">Save password</button>
  </form>
</section>
{% endblock %}
