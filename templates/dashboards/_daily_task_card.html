<div class="dt-card prio-{{ task.priority }} {% if task.status == 'done' %}done{% endif %}" data-task="{{ task.pk }}">
  <div class="dt-card-title">{{ task.title }}</div>
  {% if task.description %}<div class="dt-card-desc">{{ task.description }}</div>{% endif %}
  <div class="dt-card-meta">
    <span class="dt-tag"><i class="fas fa-flag"></i> {{ task.get_priority_display }}</span>
    {% if task.assigned_to %}<span class="dt-tag"><i class="fas fa-user"></i> {{ task.assigned_to.name|truncatechars:14 }}</span>{% endif %}
    {% if task.project %}<span class="dt-tag"><i class="fas fa-folder"></i> {{ task.project.name|truncatechars:14 }}</span>{% endif %}
  </div>
  <div class="dt-card-actions">
    <select data-dt-status data-url="{% url 'daily_task_status_update' task.pk %}">
      {% for value, label in status_choices %}
      <option value="{{ value }}" {% if task.status == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <form method="post" action="{% url 'daily_task_delete' task.pk %}" onsubmit="return confirm('Delete this task?');">
      {% csrf_token %}
      <button type="submit" class="dt-del" title="Delete"><i class="fas fa-trash"></i></button>
    </form>
  </div>
</div>
