<section class="exfiles" aria-label="{{ heading }}">
  <div class="exh">
    <div><h3>{{ heading }}</h3><span>{{ files|length }} file{{ files|length|pluralize }}</span></div>
    <a class="btn primary sm" href="{{ zip_url }}">Download all (.zip)</a>
  </div>
  <ul class="flist">
    {% for row in files %}
    <li>
      <div class="frow">
        <span class="fext">{{ row.badge }}</span>
        <div class="fname"><strong class="mono">{{ row.file.zip_path }}</strong><span>{{ row.file.description }} · {{ row.size }}</span></div>
        <div class="fbtns">
          <button class="btn sm" type="button" data-file-view aria-expanded="false">View</button>
          <button class="btn sm" type="button" data-file-copy>Copy</button>
          <a class="btn sm" href="{% url 'academy:file' row.file.id %}">Download</a>
        </div>
      </div>
      <pre class="fview" hidden><code>{{ row.file.content }}</code></pre>
    </li>
    {% endfor %}
  </ul>
</section>
