{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ralfiz Technologies{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      color: #0f172a;
      line-height: 1.5;
      padding: 32px 16px;
    }
    .page-bg {
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 40%);
      pointer-events: none; z-index: 0;
    }
    .container {
      max-width: 780px; margin: 0 auto; position: relative; z-index: 1;
    }
    .brand {
      text-align: center; margin-bottom: 32px; color: #fff;
    }
    .brand-logo {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em;
    }
    .brand-logo-dot {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800;
    }
    .brand-tagline {
      font-size: 0.85rem; color: rgba(255, 255, 255, 0.6);
      margin-top: 6px;
    }
    .card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .card-hero {
      padding: 40px 40px 28px;
      background: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 100%);
      border-bottom: 1px solid #e5e7eb;
    }
    .card-hero h1 {
      font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em;
      color: #0f172a;
    }
    .card-hero p {
      color: #475569; margin-top: 8px;
    }
    .card-body { padding: 32px 40px; }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block; font-weight: 600; font-size: 0.9rem;
      color: #1e293b; margin-bottom: 8px;
    }
    .form-control {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0;
      border-radius: 10px; font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s; background: #fff;
    }
    .form-control:focus {
      outline: none; border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 24px; border-radius: 10px; font-weight: 600; font-size: 0.95rem;
      border: none; cursor: pointer; font-family: inherit;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }
    .btn-block { width: 100%; }
    .alert {
      padding: 12px 16px; border-radius: 10px; margin-bottom: 16px;
      font-size: 0.9rem;
    }
    .alert-error {
      background: #fef2f2; color: #991b1b; border: 1px solid #fecaca;
    }
    .alert-success {
      background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0;
    }
    .otp-input {
      font-size: 2rem; letter-spacing: 12px; text-align: center;
      font-weight: 700; font-family: 'Inter', monospace;
    }
    .footer {
      text-align: center; color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem; margin-top: 24px;
    }
    .type-card {
      border: 2px solid #e2e8f0; border-radius: 14px; padding: 16px 18px;
      cursor: pointer; transition: all 0.15s; background: #fff;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .type-card:hover { border-color: #c7d2fe; background: #f8fafc; }
    .type-card.selected {
      border-color: #6366f1; background: linear-gradient(135deg, #eef2ff, #fdf2f8);
    }
    .type-card input { margin-top: 3px; }
    .type-card-name { font-weight: 700; color: #0f172a; }
    .type-card-desc { font-size: 0.85rem; color: #64748b; margin-top: 2px; }
    .features-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }
    .feature-check {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
      cursor: pointer; transition: all 0.12s; background: #fff;
    }
    .feature-check:hover { border-color: #c7d2fe; background: #f8fafc; }
    .feature-check input:checked ~ span { color: #6366f1; font-weight: 600; }
    .feature-check input { margin-top: 3px; accent-color: #6366f1; }
    .feature-check span { font-size: 0.9rem; color: #1e293b; }
    .type-section { display: none; }
    .type-section.active { display: block; }
    .type-heading {
      font-size: 1.05rem; font-weight: 700; color: #0f172a;
      margin: 24px 0 12px; display: flex; align-items: center; gap: 8px;
    }
    textarea.form-control { min-height: 100px; resize: vertical; }
    @media (max-width: 640px) {
      .card-hero, .card-body { padding: 24px 20px; }
      .card-hero h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="page-bg"></div>
  <div class="container">
    <div class="brand">
      <div class="brand-logo">
        <span class="brand-logo-dot">R</span>
        <span>Ralfiz Technologies</span>
      </div>
      <div class="brand-tagline">Project Requirements Portal</div>
    </div>
    {% block content %}{% endblock %}
    <div class="footer">Powered by Ralfiz &middot; Secure OTP-protected form</div>
  </div>
  {% block extra_js %}{% endblock %}
</body>
</html>
