{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign in · Ralfiz Staff</title>
  <script>
    // Applied before first paint so the page never flashes the wrong theme.
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('sf-theme') || 'light'; } catch (e) { /* private mode */ }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="manifest" href="{% url 'staff:manifest' %}">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ralfiz Staff">
  <link rel="apple-touch-icon" href="{% static 'staff/icon-180.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'staff/favicon-32.png' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/staff.css' %}?v=5">
  <script>window.SF_CSRF = "";</script>
</head>
<body>
  <div class="sf-auth">
    <img class="sf-auth-mark" src="{% static 'staff/icon-192.png' %}" alt="Ralfiz" width="60" height="60">
    <h1>Staff sign in</h1>
    <p class="sf-auth-sub">Attendance, leave, work and classes — from your phone browser.</p>

    {% if error %}<div class="sf-alert sf-alert-error">{{ error }}</div>{% endif %}
    {% if messages %}{% for message in messages %}
      <div class="sf-alert sf-alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}{% endif %}

    <form method="post" autocomplete="on">
      {% csrf_token %}
      <div class="sf-field">
        <label class="sf-label" for="username">Username</label>
        <input class="sf-input" type="text" id="username" name="username"
               autocapitalize="none" autocorrect="off" autocomplete="username" required>
      </div>
      <div class="sf-field">
        <label class="sf-label" for="password">Password</label>
        <input class="sf-input" type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="sf-btn"><i class="fas fa-arrow-right-to-bracket"></i> Sign in</button>
    </form>

    <button type="button" class="sf-btn sf-btn-ghost" id="sfInstallOpen" style="margin-top:26px">
      <i class="fas fa-mobile-screen-button"></i> Add to Home Screen
    </button>
  </div>
  <script src="{% static 'js/staff.js' %}?v=5"></script>
</body>
</html>
