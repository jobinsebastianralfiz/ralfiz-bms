<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* UAT pages: soft greige canvas, pill chips, timeline nodes, dark dock, lime accent. */
.ut {
  --u-canvas:#E8E6E1; --u-card:#F6F5F2; --u-raised:#FFFFFF; --u-ink:#1C1C1E; --u-ink-2:#5E5E63; --u-ink-3:#8E8E93;
  --u-line:#D6D3CC; --u-dark:#2A2A2C; --u-dark-2:#3A3A3D; --u-lime:#E3F55B; --u-lime-ink:#1C1C1E;
  --u-pass:#2F9E5B; --u-fail:#E0483E; --u-block:#E59A1B; --u-pass-bg:#E4F2E8; --u-fail-bg:#FBE5E3; --u-block-bg:#FBEFD9;
  font-family:'Manrope',Inter,system-ui,sans-serif; color:var(--u-ink);
}
[data-theme="dark"] .ut {
  --u-canvas:#1B1B1D; --u-card:#252527; --u-raised:#2E2E31; --u-ink:#F2F2F0; --u-ink-2:#B4B4B8; --u-ink-3:#86868B;
  --u-line:#3A3A3E; --u-dark:#0F0F10; --u-dark-2:#2A2A2C;
  --u-pass-bg:rgba(47,158,91,.18); --u-fail-bg:rgba(224,72,62,.18); --u-block-bg:rgba(229,154,27,.18);
}
.ut a { color:inherit; text-decoration:none; }
.ut-panel { background:var(--u-canvas); border-radius:28px; padding:22px; margin-bottom:16px; }
.ut-kicker { font-size:12px; font-weight:600; color:var(--u-ink-3); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.ut-top { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
.ut-top h1 { margin:4px 0 0; font-size:26px; font-weight:700; letter-spacing:-.02em; }
.ut-chips { display:flex; gap:8px; flex-wrap:wrap; }
.ut-chip { display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 15px; border-radius:999px; background:var(--u-raised); font-size:13px; font-weight:600; color:var(--u-ink); box-shadow:0 1px 0 rgba(0,0,0,.04); white-space:nowrap; }
.ut-chip i { font-size:12px; color:var(--u-ink-3); }
.ut-chip.ghost { background:transparent; box-shadow:inset 0 0 0 1px var(--u-line); color:var(--u-ink-2); }
.ut-chip.lime { background:var(--u-lime); color:var(--u-lime-ink); } .ut-chip.lime i { color:var(--u-lime-ink); }
a.ut-chip:hover { box-shadow:inset 0 0 0 1px var(--u-ink-3); }

/* Vitals row: small label over a big number */
.ut-thanks { display:flex; gap:14px; align-items:flex-start; background:var(--u-pass-bg); border-radius:20px; padding:18px 20px; margin-top:20px; }
.ut-thanks .ico { flex:none; width:40px; height:40px; border-radius:50%; background:var(--u-pass); color:#fff; display:grid; place-items:center; font-size:16px; }
.ut-thanks h2 { margin:0 0 4px; font-size:20px; font-weight:700; letter-spacing:-.01em; }
.ut-thanks p { margin:0 0 6px; font-size:14px; line-height:1.5; color:var(--u-ink-2); }
.ut-thanks p b { color:var(--u-ink); }
.ut-thanks small { font-size:12px; font-weight:600; color:var(--u-ink-3); }
.ut-vitals { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-top:20px; }
.ut-vital { background:var(--u-card); border-radius:20px; padding:14px 16px; }
.ut-vital small { display:block; font-size:12px; font-weight:600; color:var(--u-ink-3); margin-bottom:6px; }
.ut-vital b { font-size:28px; font-weight:700; letter-spacing:-.03em; line-height:1; }
.ut-vital b span { font-size:14px; font-weight:600; color:var(--u-ink-3); letter-spacing:0; margin-left:2px; }
.ut-vital .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }

/* Progress track: thin line, lime fill, node at the head */
.ut-track { position:relative; height:2px; background:var(--u-line); border-radius:2px; margin:22px 6px 6px; }
.ut-track i { position:absolute; left:0; top:0; height:2px; background:var(--u-ink); border-radius:2px; }
.ut-track .node { position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--u-lime); box-shadow:0 0 0 4px var(--u-canvas), 0 0 0 5px var(--u-ink); }
.ut-track .end { position:absolute; right:-6px; top:50%; width:12px; height:12px; margin-top:-6px; border-radius:50%; background:var(--u-dark); }

/* Dark dock with the next step */
.ut-dock { display:flex; align-items:center; gap:14px; background:var(--u-dark); color:#fff !important; border-radius:22px; padding:10px 10px 10px 18px; margin-top:16px; }
.ut-dock .badge { background:var(--u-lime); color:var(--u-lime-ink); font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:5px 10px; border-radius:999px; white-space:nowrap; }
.ut-dock .txt { flex:1; min-width:0; font-size:15px; font-weight:600; }
.ut-dock .txt span { color:#A1A1A6; font-weight:500; font-size:13px; }
.ut-dock .go { display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 20px; border-radius:999px; background:var(--u-lime); color:var(--u-lime-ink); font-weight:700; font-size:14px; white-space:nowrap; }
.ut-dock.wait .badge { background:var(--u-dark-2); color:#fff; }
.ut-dock.wait { padding:14px 18px; }

/* Timeline of sections */
.ut-phead { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
.ut-phead h2 { margin:0; font-size:18px; font-weight:700; letter-spacing:-.01em; }
.ut-timeline { list-style:none; margin:0; padding:0; position:relative; }
.ut-timeline::before { content:''; position:absolute; left:17px; top:18px; bottom:18px; width:2px; background:var(--u-line); }
.ut-timeline li { position:relative; display:flex; gap:16px; align-items:center; padding:6px 0; }
.ut-node { position:relative; z-index:1; width:36px; height:36px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:var(--u-canvas); box-shadow:inset 0 0 0 2px var(--u-line); color:var(--u-ink-3); }
.done .ut-node { background:var(--u-dark); box-shadow:none; color:#fff; }
.current .ut-node { background:var(--u-lime); box-shadow:0 0 0 5px var(--u-canvas), 0 0 0 6px var(--u-ink); color:var(--u-lime-ink); }
.locked .ut-node { background:var(--u-card); box-shadow:none; }
.ut-tcard { flex:1; min-width:0; display:flex; align-items:center; gap:14px; background:var(--u-card); border-radius:20px; padding:14px 16px; transition:background .15s; }
a.ut-tcard:hover { background:var(--u-raised); }
.current .ut-tcard { background:var(--u-raised); box-shadow:0 8px 24px rgba(28,28,30,.06); }
.ut-tcard .name { flex:1; min-width:0; }
.ut-tcard .name small { display:block; font-size:11.5px; font-weight:600; color:var(--u-ink-3); }
.ut-tcard .name strong { font-size:15.5px; font-weight:700; }
.locked .ut-tcard { background:transparent; box-shadow:inset 0 0 0 1px var(--u-line); }
.locked .ut-tcard strong { font-weight:600; color:var(--u-ink-2); }
.ut-ratio { font-size:14px; font-weight:700; white-space:nowrap; } .ut-ratio span { color:var(--u-ink-3); font-weight:600; }
.ut-mini { width:70px; height:4px; background:var(--u-line); border-radius:4px; overflow:hidden; }
.ut-mini i { display:block; height:100%; background:var(--u-ink); }
.ut-arrow { width:32px; height:32px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--u-canvas); color:var(--u-ink-2); font-size:12px; }
.current .ut-arrow { background:var(--u-dark); color:#fff; }
.ut-divider { padding:14px 0 6px 52px !important; font-size:12px; font-weight:700; color:var(--u-ink-3); }
.ut-pill { display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 10px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; background:var(--u-canvas); color:var(--u-ink-2); }
.ut-pill.pass { background:var(--u-pass-bg); color:var(--u-pass); }
.ut-pill.fail { background:var(--u-fail-bg); color:var(--u-fail); }
.ut-pill.blocked { background:var(--u-block-bg); color:var(--u-block); }
.ut-pill.lime { background:var(--u-lime); color:var(--u-lime-ink); }
.ut-pill.dark { background:var(--u-dark); color:#fff; }

/* How to test */
.ut-guide > summary { list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.ut-guide > summary::-webkit-details-marker { display:none; }
.ut-guide > summary h2 { margin:0; font-size:18px; font-weight:700; }
.ut-guide > summary .ut-arrow { transition:transform .2s; }
.ut-guide[open] > summary .ut-arrow { transform:rotate(180deg); }
.ut-guide-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; margin-top:16px; }
.ut-guide-grid > div { background:var(--u-card); border-radius:20px; padding:16px 18px; }
.ut-guide h3 { margin:0 0 10px; font-size:13px; font-weight:700; }
.ut-guide ol, .ut-guide ul { margin:0; padding-left:18px; font-size:13.5px; line-height:1.6; color:var(--u-ink-2); }
.ut-guide li + li { margin-top:6px; }

/* Section page: dark code dock */
.ut-codes { display:flex; gap:6px; flex-wrap:wrap; background:var(--u-dark); border-radius:22px; padding:8px; margin-top:18px; }
.ut-codes a { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:999px; font:700 11.5px ui-monospace,SFMono-Regular,Menlo,monospace; color:#A1A1A6 !important; background:transparent; }
.ut-codes a::before { content:''; width:7px; height:7px; border-radius:50%; background:#55555A; }
.ut-codes a:hover { background:var(--u-dark-2); color:#fff !important; }
.ut-codes a.pass::before { background:var(--u-lime); } .ut-codes a.fail::before { background:var(--u-fail); } .ut-codes a.blocked::before { background:var(--u-block); }
.ut-codes a.pass, .ut-codes a.fail, .ut-codes a.blocked { color:#fff !important; }
.ut-lock { display:flex; gap:12px; align-items:center; margin-top:14px; background:var(--u-block-bg); border-radius:18px; padding:12px 16px; font-size:14px; }
.ut-lock i { color:var(--u-block); }

/* Test card */
.ut-test { background:var(--u-canvas); border-radius:28px; padding:8px; margin-bottom:14px; scroll-margin-top:84px; }
.ut-test-head { display:flex; align-items:center; gap:12px; padding:10px 12px 12px; cursor:pointer; }
.ut-code { display:inline-flex; align-items:center; height:28px; padding:0 11px; border-radius:999px; background:var(--u-raised); font:700 11.5px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--u-ink-2); white-space:nowrap; }
.ut-test-head .t { flex:1; min-width:0; }
.ut-title { display:block; font-size:17px; font-weight:700; letter-spacing:-.01em; }
.ut-tags { display:flex; gap:6px; flex-wrap:wrap; }
.ut-tag { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; border-radius:999px; box-shadow:inset 0 0 0 1px var(--u-line); font-size:11.5px; font-weight:600; color:var(--u-ink-2); }
.ut-test-body { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:8px; }
.ut-box { background:var(--u-card); border-radius:20px; padding:16px 18px; }
.ut-box.exp { background:var(--u-raised); }
.ut-label { margin:0 0 8px; font-size:12px; font-weight:700; color:var(--u-ink-3); display:flex; align-items:center; gap:7px; }
.ut-label .lime-dot { width:8px; height:8px; border-radius:50%; background:var(--u-lime); box-shadow:0 0 0 1.5px var(--u-ink); }
.ut-steps { margin:0; padding-left:20px; font-size:14px; line-height:1.65; }
.ut-steps li + li { margin-top:4px; }
.ut-exp { font-size:14px; line-height:1.6; }
.ut-fixnote { margin:0 4px 8px; padding:10px 14px; border-radius:16px; background:var(--u-lime); color:var(--u-lime-ink); font-size:13px; font-weight:600; }
.ut-test-foot { margin-top:8px; background:var(--u-card); border-radius:20px; padding:12px; }
.ut-choice { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.ut-choice input { position:absolute; opacity:0; pointer-events:none; }
.ut-choice label { display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 18px; border-radius:999px; background:var(--u-raised); font-weight:700; font-size:14px; color:var(--u-ink-2); cursor:pointer; box-shadow:inset 0 0 0 1px var(--u-line); }
.ut-choice label:hover { box-shadow:inset 0 0 0 1px var(--u-ink-3); }
.ut-choice input:checked + label.pass { background:var(--u-lime); color:var(--u-lime-ink); box-shadow:none; }
.ut-choice input:checked + label.fail { background:var(--u-fail); color:#fff; box-shadow:none; }
.ut-choice input:checked + label.blocked { background:var(--u-block); color:#fff; box-shadow:none; }
.ut-choice input:focus-visible + label { outline:2px solid var(--u-ink); outline-offset:2px; }
.ut-choice .grow { flex:1; }
.ut-save { display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 20px; border:0; border-radius:999px; background:var(--u-dark); color:#fff; font:700 14px 'Manrope',Inter,sans-serif; cursor:pointer; }
[data-theme="dark"] .ut-save { background:var(--u-lime); color:var(--u-lime-ink); }
.ut-save:disabled { opacity:.45; cursor:not-allowed; }
.ut-more { display:none; margin-top:10px; }
.ut-test:has(input[value=fail]:checked) .ut-more, .ut-test:has(input[value=blocked]:checked) .ut-more, .ut-more.has { display:block; }
.ut-note { width:100%; min-height:80px; border:0; border-radius:16px; padding:12px 14px; font:inherit; font-size:14px; resize:vertical; background:var(--u-raised); color:var(--u-ink); box-shadow:inset 0 0 0 1px var(--u-line); }
.ut-note:focus { outline:none; box-shadow:inset 0 0 0 2px var(--u-ink); }
.ut-attach { display:flex; gap:10px; align-items:center; justify-content:flex-end; margin-top:10px; flex-wrap:wrap; }
.ut-attach .ut-msg { margin-left:auto; }
.ut-attach .ut-chip.ut-more { display:none; }
.ut-test:has(input[value=fail]:checked) .ut-attach .ut-chip.ut-more, .ut-test:has(input[value=blocked]:checked) .ut-attach .ut-chip.ut-more, .ut-attach .ut-chip.ut-more.has { display:inline-flex; }
.ut-msg { font-size:13px; font-weight:600; } .ut-msg.err { color:var(--u-fail); } .ut-msg.ok { color:var(--u-pass); }
.ut-shot { max-width:150px; max-height:100px; border-radius:12px; display:block; margin-top:10px; }
.ut-test.s-pass:not(.open) .ut-test-body, .ut-test.s-pass:not(.open) .ut-test-foot, .ut-test.s-pass:not(.open) .ut-fixnote { display:none; }
.ut-test.s-pass:not(.open) .ut-test-head { padding-bottom:10px; }
.ut-nav { display:flex; justify-content:space-between; gap:8px; margin:4px 0 24px; flex-wrap:wrap; }
.ut-muted { color:var(--u-ink-3); font-size:13px; }

/* Plan cards (UAT home) */
.ut-intro { padding:4px 4px 18px; }
.ut-intro h1 { margin:0; font-size:26px; font-weight:700; letter-spacing:-.02em; }
.ut-intro p { margin:6px 0 0; font-size:14px; color:var(--u-ink-2); }
.ut-plans { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
.ut-plan { display:flex; flex-direction:column; background:var(--u-canvas); border-radius:28px; padding:22px; transition:transform .15s, box-shadow .15s; }
.ut-plan:hover { transform:translateY(-2px); box-shadow:0 14px 34px rgba(28,28,30,.10); }
.ut-plan:focus-visible { outline:2px solid var(--u-ink); outline-offset:3px; }
.ut-plan-top { display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:24px; }
.ut-plan-product { font-size:12px; font-weight:700; color:var(--u-ink-3); text-transform:uppercase; letter-spacing:.06em; }
.ut-plan h2 { margin:10px 0 0; font-size:22px; font-weight:700; letter-spacing:-.02em; }
.ut-plan-meta { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:8px; font-size:13px; font-weight:600; color:var(--u-ink-2); }
.ut-plan-meta i { color:var(--u-ink-3); margin-right:5px; font-size:12px; }
.ut-plan-meta .late, .ut-plan-meta .late i { color:var(--u-fail); }
.ut-plan-progress { display:flex; justify-content:space-between; align-items:baseline; margin-top:22px; }
.ut-plan-progress b { font-size:32px; font-weight:700; letter-spacing:-.03em; line-height:1; }
.ut-plan-progress b span { font-size:14px; font-weight:600; color:var(--u-ink-3); letter-spacing:0; margin-left:4px; }
.ut-plan-progress .pct { font-size:14px; font-weight:700; color:var(--u-ink-2); }
.ut-plan-bar { height:8px; background:var(--u-card); border-radius:8px; margin-top:12px; overflow:hidden; }
.ut-plan-bar i { display:block; height:100%; background:var(--u-ink); border-radius:8px; box-shadow:inset -8px 0 0 var(--u-lime); }
.ut-plan-counts { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:12px; font-size:12.5px; font-weight:600; color:var(--u-ink-2); }
.ut-plan-counts .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.ut-plan-foot { display:flex; align-items:center; gap:12px; margin-top:auto; padding-top:18px; }
.ut-plan-foot .txt { flex:1; min-width:0; background:var(--u-card); border-radius:18px; padding:10px 14px; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ut-plan-foot .txt small { display:block; font-size:11.5px; font-weight:600; color:var(--u-ink-3); }
.ut-plan-foot .go { display:inline-flex; align-items:center; gap:8px; height:46px; padding:0 20px; border-radius:999px; background:var(--u-dark); color:#fff; font-weight:700; font-size:14px; white-space:nowrap; transition:background .15s, color .15s; }
.ut-plan:hover .go { background:var(--u-lime); color:var(--u-lime-ink); }
[data-theme="dark"] .ut-plan .ut-pill.dark { background:var(--u-raised); color:var(--u-ink); }
[data-theme="dark"] .ut-plan-foot .go { background:var(--u-lime); color:var(--u-lime-ink); }

@media (min-width:1000px) { .ut-dock.stick { position:sticky; bottom:16px; z-index:5; box-shadow:0 16px 40px rgba(0,0,0,.18); } }
@media (max-width:760px) {
  .ut-panel { padding:16px; border-radius:24px; }
  .ut-top h1 { font-size:22px; }
  .ut-plans { grid-template-columns:1fr; }
  .ut-plan { padding:18px; border-radius:24px; }
  .ut-intro h1 { font-size:22px; }
  .ut-vitals { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .ut-vitals .ut-vital:first-child { grid-column:1 / -1; }
  .ut-test-body { grid-template-columns:1fr; }
  .ut-tcard .ut-mini, .ut-tcard .hide-sm { display:none; }
  .ut-dock .txt span { display:none; }
  .ut-choice label { padding:0 14px; }
  .hide-sm { display:none !important; }
  .ut-choice label { flex:1; justify-content:center; }
  .ut-save { width:100%; justify-content:center; }
}
.ut-file { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.ut-file .ut-tcard strong { display:block; overflow-wrap:anywhere; }
.ut-file form { margin:0; }
.ut-filedel { width:40px; height:40px; border:0; border-radius:50%; background:var(--u-card); color:var(--u-ink-2); cursor:pointer; }
.ut-filedel:hover { background:var(--u-fail-bg); color:var(--u-fail); }
.ut-filehint { font-size:13.5px; color:var(--u-ink-2); }
.ut-fileup { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; background:var(--u-card); border-radius:20px; padding:14px 16px; margin-top:12px; }
.ut-fileup label { flex:1 1 240px; min-width:0; font-size:13.5px; font-weight:700; }
.ut-fileup label span { display:block; font-size:12px; font-weight:600; color:var(--u-ink-3); margin:2px 0 8px; }
.ut-fileup input[type=file] { display:block; width:100%; font-size:13px; color:var(--u-ink-2); }
.ut-fileup input[type=text] { flex:1 1 180px; min-width:0; height:42px; padding:0 14px; border-radius:999px; border:1px solid var(--u-line); background:var(--u-raised); color:var(--u-ink); font:inherit; font-size:13.5px; }
.ut-fileup button { height:42px; padding:0 20px; border:0; border-radius:999px; background:var(--u-dark); color:#fff; font:inherit; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; }
</style>
