{% extends 'base.html' %}
{% block title %}Assign Work - Ralfiz BMS{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Assign Work</h1>
    <p class="page-subtitle mb-0">Create a new work assignment for an employee</p>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <h3 class="card-title"><i class="fas fa-plus me-2"></i> New Assignment</h3>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row mb-3">
        <div class="col-8">
          <label class="form-label">Title *</label>
          <input type="text" name="title" class="form-control" required placeholder="Enter task title">
        </div>
        <div class="col-4">
          <label class="form-label">Priority</label>
          <select name="priority" class="form-control">
            {% for key, value in priority_choices %}
            <option value="{{ key }}" {% if key == 'medium' %}selected{% endif %}>{{ value }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Describe the work..."></textarea>
      </div>
      <div class="row mb-3">
        <div class="col-6">
          <label class="form-label">Assign To *</label>
          <select name="employee" class="form-control" required>
            <option value="">Select Employee</option>
            {% for emp in employees %}
            <option value="{{ emp.pk }}">{{ emp.full_name }} ({{ emp.employee_id }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-6">
          <label class="form-label">Due Date</label>
          <input type="date" name="due_date" class="form-control">
        </div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane me-2"></i> Assign & Notify</button>
        <a href="{% url 'emp_work_list' %}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
