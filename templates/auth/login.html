{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Ralfiz BMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/pulse-auth.css' %}">
</head>
<body class="auth-body">

  <main class="auth-shell">

    <div class="auth-brand">
      <svg class="auth-brand__mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.5 14.3 8 21 10.3 14.3 12.6 12 19.1 9.7 12.6 3 10.3 9.7 8Z"/>
        <path class="auth-brand__spark" d="M18.5 15.2 19.6 18l2.9 1.1-2.9 1.1-1.1 2.8-1.1-2.8-2.9-1.1 2.9-1.1Z"/>
      </svg>
      <span class="auth-brand__text">
        <span class="auth-brand__name">Ralfiz</span>
        <span class="auth-brand__sub">Business Management</span>
      </span>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-lede">Use your Ralfiz account to continue.</p>

      {% if messages %}
        {% for message in messages %}
          <div class="auth-alert {% if 'success' in message.tags %}is-success{% endif %}" role="alert">
            <span class="auth-alert__dot" aria-hidden="true"></span>
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" autocomplete="on">
        {% csrf_token %}

        <div class="auth-field">
          <label class="auth-label" for="username">Username</label>
          <input class="auth-input" type="text" id="username" name="username"
                 placeholder="Your username" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required autofocus>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="password">Password</label>
          <div class="auth-input-wrap">
            <input class="auth-input auth-input--password" type="password" id="password"
                   name="password" placeholder="Your password"
                   autocomplete="current-password" required>
            <button class="auth-reveal" type="button" id="reveal"
                    aria-label="Show password" aria-pressed="false">
              <svg id="reveal-icon" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M1.8 10S4.9 4.6 10 4.6 18.2 10 18.2 10 15.1 15.4 10 15.4 1.8 10 1.8 10Z"/>
                <circle cx="10" cy="10" r="2.4"/>
              </svg>
            </button>
          </div>
        </div>

        <label class="auth-remember">
          <input type="checkbox" name="remember">
          <span>Keep me signed in</span>
        </label>

        <button class="auth-submit" type="submit">Sign in</button>
      </form>
    </div>

    <p class="auth-footer">
      &copy; 2026 <a href="/">Ralfiz Technologies</a>
    </p>

  </main>

  <script>
    (function () {
      var field  = document.getElementById('password');
      var button = document.getElementById('reveal');
      var icon   = document.getElementById('reveal-icon');

      var EYE = '<path d="M1.8 10S4.9 4.6 10 4.6 18.2 10 18.2 10 15.1 15.4 10 15.4 1.8 10 1.8 10Z"/><circle cx="10" cy="10" r="2.4"/>';
      var OFF = '<path d="M1.8 10S4.9 4.6 10 4.6c1.2 0 2.3.3 3.2.8M18.2 10s-1.4 2.4-3.8 3.9M10 15.4c-5.1 0-8.2-5.4-8.2-5.4"/><path d="M3 3l14 14"/>';

      button.addEventListener('click', function () {
        var shown = field.type === 'text';
        field.type = shown ? 'password' : 'text';
        icon.innerHTML = shown ? EYE : OFF;
        button.setAttribute('aria-label', shown ? 'Show password' : 'Hide password');
        button.setAttribute('aria-pressed', shown ? 'false' : 'true');
        field.focus();
      });
    })();
  </script>
</body>
</html>
