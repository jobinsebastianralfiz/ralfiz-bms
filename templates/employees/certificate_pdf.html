<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    @page {
        size: A4;
        margin: 0;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Helvetica Neue', 'Arial', 'Helvetica', sans-serif;
        color: #222;
        font-size: 14px;
        line-height: 1.7;
    }

    /* ========== GREEN LEFT BAR ========== */
    .bar-left {
        position: fixed;
        top: 0;
        left: 0;
        width: 12px;
        bottom: 0;
        background: #4CAF50;
    }

    /* ========== GREEN BOTTOM-RIGHT L-SHAPE ========== */
    .bar-bottom {
        position: fixed;
        bottom: 0;
        right: 0;
        width: 240px;
        height: 12px;
        background: #4CAF50;
    }

    .bar-right {
        position: fixed;
        bottom: 0;
        right: 0;
        width: 12px;
        height: 240px;
        background: #4CAF50;
    }

    /* ========== WATERMARK ========== */
    .watermark {
        position: fixed;
        top: 28%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0.045;
        z-index: -1;
    }

    .watermark img {
        width: 400px;
    }

    /* ========== CONTENT ========== */
    .content {
        padding: 32mm 30mm 25mm 30mm;
        margin-left: 12px;
    }

    /* ========== HEADER ========== */
    .header {
        margin-bottom: 60px;
    }

    .header img {
        height: 52px;
    }

    /* ========== TITLE ========== */
    .title {
        text-align: center;
        font-size: 28px;
        font-weight: 900;
        color: #1a1a1a;
        margin-bottom: 30px;
        letter-spacing: 1px;
        font-family: 'Arial Black', 'Helvetica', sans-serif;
    }

    /* ========== BODY TEXT ========== */
    .body-text {
        text-align: center;
        font-size: 14px;
        line-height: 1.75;
        margin-bottom: 4px;
    }

    .body-text strong {
        font-weight: bold;
    }

    /* ========== SKILLS LIST ========== */
    .skills-list {
        margin: 16px 0 16px 60px;
        text-align: left;
        font-size: 14px;
        list-style-type: disc;
        padding-left: 0;
    }

    .skills-list li {
        margin-bottom: 3px;
        line-height: 1.6;
    }

    /* ========== CLOSING / WISH ========== */
    .closing {
        text-align: center;
        font-size: 14px;
        line-height: 1.75;
        margin-top: 24px;
    }

    .wish {
        text-align: center;
        font-size: 14px;
        margin-top: 6px;
    }

    /* ========== FOOTER AREA ========== */
    .footer-area {
        position: fixed;
        bottom: 25mm;
        left: 42px;
        right: 30mm;
    }

    /* Signature row */
    .sig-row {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 0;
    }

    .sig-row td {
        padding: 0;
        vertical-align: bottom;
    }

    .sig-left {
        width: 45%;
    }

    .sig-left img {
        height: 58px;
        display: block;
        margin-bottom: -2px;
    }

    .sig-left .line {
        width: 175px;
        border-top: 1.5px solid #333;
        margin-bottom: 5px;
    }

    .sig-left .name {
        font-weight: bold;
        font-size: 14px;
        font-family: 'Times New Roman', serif;
        letter-spacing: 0.5px;
    }

    .sig-left .designation {
        font-weight: bold;
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    .sig-left .company {
        font-size: 10px;
        letter-spacing: 0.5px;
    }

    .sig-center {
        width: 55%;
        text-align: center;
    }

    .sig-center img {
        height: 85px;
    }

    /* Bottom details row */
    .details-row {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
    }

    .details-row td {
        padding: 0;
        vertical-align: bottom;
    }

    .qr-cell {
        width: 75px;
    }

    .qr-cell img {
        width: 60px;
        height: 60px;
    }

    .qr-cell .qr-label {
        font-size: 7px;
        color: #777;
    }

    .details-right {
        text-align: right;
    }

    .details-right .logos img {
        height: 30px;
    }

    .details-right .issuance {
        font-size: 10px;
        font-style: italic;
        margin-top: 8px;
        color: #444;
    }

    .details-right .address {
        font-size: 9.5px;
        color: #555;
        margin-top: 4px;
        line-height: 1.5;
    }
</style>
</head>
<body>
    <!-- Green bars -->
    <div class="bar-left"></div>
    <div class="bar-bottom"></div>
    <div class="bar-right"></div>

    <!-- Watermark -->
    <div class="watermark">
        <img src="{{ seal }}" alt="">
    </div>

    <!-- Main content -->
    <div class="content">
        <!-- Header logo -->
        <div class="header">
            <img src="{{ header_logo }}" alt="Ralfiz Technologies">
        </div>

        <!-- Certificate title -->
        <h1 class="title">{{ cert.title }}</h1>

        <!-- Certificate body content -->
        {{ rendered_body|safe }}

        <!-- Wish text -->
        <p class="wish">
            {{ wish_text }}
        </p>
    </div>

    <!-- Footer -->
    <div class="footer-area">
        <!-- Signature + Seal -->
        <table class="sig-row">
            <tr>
                <td class="sig-left">
                    <img src="{{ signature }}" alt="Signature">
                    <div class="line"></div>
                    <div class="name">JOBIN SEBASTIAN</div>
                    <div class="designation">Managing Director</div>
                    <div class="company">RALFIZ TECHNOLOGIES</div>
                </td>
                <td class="sig-center">
                    <img src="{{ seal }}" alt="Company Seal">
                </td>
            </tr>
        </table>

        <!-- QR code + Partner logos + Issuance details -->
        <table class="details-row">
            <tr>
                <td class="qr-cell">
                    <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code">
                    <div class="qr-label">Scan to verify</div>
                </td>
                <td class="details-right">
                    <div class="logos">
                        <img src="{{ footer_logo }}" alt="Partner Logos">
                    </div>
                    <div class="issuance">
                        <em>Date of issuance: {{ date_of_issuance_fmt }}</em> &nbsp;&nbsp;
                        <em>Ref No: {{ cert.certificate_number }}</em>
                    </div>
                    <div class="address">
                        Level 2, KIMS Avenue<br>
                        Perinthalmanna, Pattambi Road<br>
                        9895663498, info@ralfiz.com
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
