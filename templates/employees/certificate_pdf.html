<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    @page {
        size: A4;
        margin: 0;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Georgia', 'Times New Roman', serif;
        color: #2c2c2c;
        font-size: 13.5px;
        line-height: 1.7;
    }

    /* ========== DECORATIVE BORDER FRAME ========== */
    .outer-border {
        position: fixed;
        top: 12mm;
        left: 12mm;
        right: 12mm;
        bottom: 12mm;
        border: 3px solid #1a6b3c;
    }

    .inner-border {
        position: fixed;
        top: 15mm;
        left: 15mm;
        right: 15mm;
        bottom: 15mm;
        border: 1px solid #1a6b3c;
    }

    /* Corner ornaments */
    .corner {
        position: fixed;
        width: 30px;
        height: 30px;
        z-index: 2;
    }

    .corner-tl {
        top: 11mm;
        left: 11mm;
        border-top: 5px solid #b8860b;
        border-left: 5px solid #b8860b;
    }

    .corner-tr {
        top: 11mm;
        right: 11mm;
        border-top: 5px solid #b8860b;
        border-right: 5px solid #b8860b;
    }

    .corner-bl {
        bottom: 11mm;
        left: 11mm;
        border-bottom: 5px solid #b8860b;
        border-left: 5px solid #b8860b;
    }

    .corner-br {
        bottom: 11mm;
        right: 11mm;
        border-bottom: 5px solid #b8860b;
        border-right: 5px solid #b8860b;
    }

    /* ========== CONTENT AREA ========== */
    .content {
        padding: 22mm 28mm 20mm 28mm;
        position: relative;
    }

    /* Watermark - centered */
    .watermark {
        position: fixed;
        top: 32%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0.04;
        z-index: -1;
    }

    .watermark img {
        width: 340px;
    }

    /* ========== HEADER ========== */
    .header {
        text-align: left;
        margin-bottom: 42px;
    }

    .header img {
        height: 50px;
    }

    /* ========== DECORATIVE DIVIDER ========== */
    .divider {
        text-align: center;
        margin: 8px 0 22px 0;
    }

    .divider-line {
        display: inline-block;
        width: 80px;
        height: 1px;
        background: #b8860b;
        vertical-align: middle;
    }

    .divider-diamond {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #b8860b;
        transform: rotate(45deg);
        margin: 0 10px;
        vertical-align: middle;
    }

    /* ========== TITLE ========== */
    .title {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        color: #1a3c2a;
        margin-bottom: 6px;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-family: 'Georgia', 'Times New Roman', serif;
    }

    /* ========== BODY TEXT ========== */
    .body-text {
        text-align: center;
        font-size: 13.5px;
        line-height: 1.8;
        margin-bottom: 6px;
        color: #333;
    }

    .body-text strong {
        font-weight: bold;
        color: #1a1a1a;
    }

    /* ========== SKILLS LIST ========== */
    .skills-list {
        margin: 14px auto 14px auto;
        text-align: left;
        font-size: 13.5px;
        list-style-type: none;
        display: inline-block;
    }

    .skills-list li {
        margin-bottom: 4px;
        line-height: 1.6;
        padding-left: 18px;
        position: relative;
    }

    .skills-list li::before {
        content: "\2022";
        color: #1a6b3c;
        font-size: 16px;
        position: absolute;
        left: 0;
        top: -1px;
    }

    /* Wrapper to center the skills list */
    .skills-wrapper {
        text-align: center;
    }

    /* ========== CLOSING / WISH ========== */
    .closing {
        text-align: center;
        font-size: 13.5px;
        line-height: 1.8;
        margin-top: 18px;
    }

    .wish {
        text-align: center;
        font-size: 13.5px;
        margin-top: 6px;
        font-style: italic;
        color: #444;
    }

    /* ========== FOOTER AREA ========== */
    .footer-area {
        position: fixed;
        bottom: 22mm;
        left: 28mm;
        right: 28mm;
    }

    /* Signature row */
    .sig-row {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 0;
    }

    .sig-row td {
        padding: 0;
        vertical-align: bottom;
    }

    .sig-left {
        width: 45%;
    }

    .sig-left img {
        height: 55px;
        display: block;
        margin-bottom: -2px;
    }

    .sig-left .line {
        width: 170px;
        border-top: 1.5px solid #1a3c2a;
        margin-bottom: 5px;
    }

    .sig-left .name {
        font-weight: bold;
        font-size: 13px;
        font-family: 'Georgia', serif;
        letter-spacing: 1px;
        color: #1a1a1a;
        text-transform: uppercase;
    }

    .sig-left .designation {
        font-weight: bold;
        font-size: 9.5px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #1a6b3c;
        margin-top: 1px;
    }

    .sig-left .company {
        font-size: 9.5px;
        letter-spacing: 0.5px;
        color: #555;
    }

    .sig-center {
        width: 55%;
        text-align: center;
    }

    .sig-center img {
        height: 80px;
    }

    /* Bottom details row */
    .details-row {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
    }

    .details-row td {
        padding: 0;
        vertical-align: bottom;
    }

    .qr-cell {
        width: 75px;
    }

    .qr-cell img {
        width: 60px;
        height: 60px;
    }

    .qr-cell .qr-label {
        font-size: 7px;
        color: #888;
        letter-spacing: 0.3px;
    }

    .details-right {
        text-align: right;
    }

    .details-right .logos img {
        height: 36px;
    }

    .details-right .issuance {
        font-size: 9.5px;
        font-style: italic;
        margin-top: 6px;
        color: #555;
    }

    .details-right .address {
        font-size: 9px;
        color: #666;
        margin-top: 3px;
        line-height: 1.45;
    }

    /* ========== GREEN ACCENT BARS (keeping brand identity) ========== */
    .accent-left {
        position: fixed;
        top: 12mm;
        left: 0;
        width: 8mm;
        bottom: 12mm;
        background: linear-gradient(to bottom, #1a6b3c, #2e8b57);
    }

    .accent-bottom-right {
        position: fixed;
        bottom: 0;
        right: 12mm;
        width: 180px;
        height: 8mm;
        background: linear-gradient(to left, #1a6b3c, #2e8b57);
    }

    .accent-right-vert {
        position: fixed;
        bottom: 12mm;
        right: 0;
        width: 8mm;
        height: 180px;
        background: linear-gradient(to top, #1a6b3c, #2e8b57);
    }

    /* Gold thin line inside green bar */
    .gold-stripe-left {
        position: fixed;
        top: 12mm;
        left: 7mm;
        width: 1px;
        bottom: 12mm;
        background: #b8860b;
    }
</style>
</head>
<body>
    <!-- Green accent bars with gradient -->
    <div class="accent-left"></div>
    <div class="accent-bottom-right"></div>
    <div class="accent-right-vert"></div>
    <div class="gold-stripe-left"></div>

    <!-- Decorative double border frame -->
    <div class="outer-border"></div>
    <div class="inner-border"></div>

    <!-- Gold corner ornaments -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Watermark -->
    <div class="watermark">
        <img src="{{ seal }}" alt="">
    </div>

    <!-- Main content -->
    <div class="content">
        <!-- Header logo -->
        <div class="header">
            <img src="{{ header_logo }}" alt="Ralfiz Technologies">
        </div>

        <!-- Certificate title -->
        <h1 class="title">{{ cert.title }}</h1>

        <!-- Decorative divider -->
        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-diamond"></span>
            <span class="divider-line"></span>
        </div>

        <!-- Certificate body content -->
        {{ rendered_body|safe }}

        <!-- Wish text -->
        <p class="wish">
            {{ wish_text }}
        </p>
    </div>

    <!-- Footer: signature, seal, QR, details — pinned to bottom -->
    <div class="footer-area">
        <!-- Signature + Seal -->
        <table class="sig-row">
            <tr>
                <td class="sig-left">
                    <img src="{{ signature }}" alt="Signature">
                    <div class="line"></div>
                    <div class="name">Jobin Sebastian</div>
                    <div class="designation">Managing Director</div>
                    <div class="company">Ralfiz Technologies</div>
                </td>
                <td class="sig-center">
                    <img src="{{ seal }}" alt="Company Seal">
                </td>
            </tr>
        </table>

        <!-- QR code + Partner logos + Issuance details -->
        <table class="details-row">
            <tr>
                <td class="qr-cell">
                    <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code">
                    <div class="qr-label">Scan to verify</div>
                </td>
                <td class="details-right">
                    <div class="logos">
                        <img src="{{ footer_logo }}" alt="Partner Logos">
                    </div>
                    <div class="issuance">
                        <em>Date of issuance: {{ date_of_issuance_fmt }}</em> &nbsp;&nbsp;
                        <em>Ref No: {{ cert.certificate_number }}</em>
                    </div>
                    <div class="address">
                        Level 2, KIMS Avenue<br>
                        Perinthalmanna, Pattambi Road<br>
                        9895663498, info@ralfiz.com
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
